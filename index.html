<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دكتور القرية - باها</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="logo.png">
    <meta name="theme-color" content="#007bff">

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #007bff; --success: #28a745; --purple: #6f42c1; --bg: #f4f7f6; }
        body { font-family: 'Cairo', sans-serif; margin: 0; background: var(--bg); color: #333; -webkit-tap-highlight-color: transparent; }
        header { background: linear-gradient(45deg, #007bff, #00c6ff); color: white; padding: 25px; text-align: center; border-radius: 0 0 25px 25px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .container { padding: 15px; max-width: 800px; margin: auto; }
        
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-top: 10px; }
        .card { background: white; padding: 20px; border-radius: 20px; text-align: center; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.05); transition: 0.3s; border: 1px solid transparent; }
        .card:active { transform: scale(0.95); background: #eef6ff; }
        .card .icon { font-size: 35px; margin-bottom: 8px; display: block; }
        .card .label { font-weight: bold; font-size: 15px; }

        .hidden { display: none; }
        .back-btn { background: #fff; border: 1px solid #ddd; padding: 8px 20px; border-radius: 50px; cursor: pointer; margin-bottom: 15px; font-weight: bold; font-family: 'Cairo'; display: flex; align-items: center; gap: 5px; }

        .folder-item { background: white; padding: 18px 20px; border-radius: 15px; margin-bottom: 10px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); border-right: 5px solid var(--primary); }

        .doctor-detail-card { background: white; padding: 25px; border-radius: 25px; box-shadow: 0 5px 15px rgba(0,0,0,0.08); text-align: right; border-top: 6px solid var(--primary); }
        .status-badge { display: inline-block; padding: 6px 15px; border-radius: 50px; font-weight: bold; margin-bottom: 15px; font-size: 0.9rem; }
        
        .info-row { margin-bottom: 12px; line-height: 1.6; }
        .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 25px; }
        .btn { text-align: center; padding: 12px; border-radius: 12px; text-decoration: none; font-weight: bold; color: white; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 0.9rem; border: none; cursor: pointer; }
        .btn-call { background: var(--success); }
        .btn-map { background: var(--primary); }
        .btn-social { background: var(--purple); grid-column: span 2; }

        .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index: 1000; align-items: center; justify-content: center; }
        .modal-content { background: white; padding: 25px; border-radius: 20px; width: 85%; max-width: 400px; position: relative; text-align: center; }
        .close { position: absolute; top:10px; left:15px; font-size: 25px; cursor: pointer; color: #999; }
        .link-btn { display: block; background: var(--purple); color: white; padding: 10px; border-radius: 10px; text-decoration: none; margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>

<header>
    <h1>🩺 دكتور القرية</h1>
    <p>دليلك الطبي الشامل بقرية باها</p>
</header>

<div class="container">
    <div id="section-home">
        <div class="grid">
            <div class="card" onclick="showSection('section-specialties')"><span class="icon">👨‍⚕️</span><span class="label">بشري</span></div>
            <div class="card" onclick="alert('قريباً')"><span class="icon">🦷</span><span class="label">أسنان</span></div>
            <div class="card" onclick="alert('قريباً')"><span class="icon">💊</span><span class="label">صيدليات</span></div>
            <div class="card" onclick="alert('قريباً')"><span class="icon">🐄</span><span class="label">بيطري</span></div>
            <div class="card" onclick="alert('قريباً')"><span class="icon">🧪</span><span class="label">معامل</span></div>
            <div class="card" onclick="alert('قريباً')"><span class="icon">📸</span><span class="label">أشعة</span></div>
            <div class="card" onclick="alert('قريباً')"><span class="icon">🚑</span><span class="label">طوارئ</span></div>
            <div class="card" onclick="alert('قريباً')"><span class="icon">🧑‍⚕️</span><span class="label">تمريض</span></div>
        </div>
    </div>

    <div id="section-specialties" class="hidden">
        <button class="back-btn" onclick="showSection('section-home')">🔙 رجوع</button>
        <div class="grid">
            <div class="card" onclick="renderDoctorList('نساء وتوليد')"><span class="icon">🤰</span>نساء وتوليد</div>
            <div class="card" onclick="renderDoctorList('عظام')"><span class="icon">🦴</span>عظام</div>
            <div class="card" onclick="renderDoctorList('باطنة')"><span class="icon">🩺</span>باطنة</div>
            <div class="card" onclick="renderDoctorList('أطفال')"><span class="icon">👶</span>أطفال</div>
            <div class="card" onclick="renderDoctorList('جراحة')"><span class="icon">🔪</span>جراحة</div>
            <div class="card" onclick="renderDoctorList('جلدية')"><span class="icon">✨</span>جلدية</div>
            <div class="card" onclick="renderDoctorList('رمد')"><span class="icon">👁️</span>رمد</div>
            <div class="card" onclick="renderDoctorList('أنف وأذن')"><span class="icon">👂</span>أنف وأذن</div>
        </div>
    </div>

    <div id="section-doctors-list" class="hidden">
        <button class="back-btn" onclick="showSection('section-specialties')">🔙 رجوع</button>
        <div id="list-container"></div>
    </div>

    <div id="section-doctor-detail" class="hidden">
        <button id="back-to-list-btn" class="back-btn">🔙 رجوع</button>
        <div id="detail-container"></div>
    </div>
</div>

<div id="infoModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="hideModal()">×</span>
        <h3 style="color:var(--primary)">🎓 الدرجات العلمية</h3>
        <ul id="modalBody" style="text-align: right;"></ul>
    </div>
</div>

<div id="socialModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="hideModal()">×</span>
        <h3 style="color:var(--purple)">روابط التواصل والباركود</h3>
        <img id="qrImg" src="" style="width: 250px; height: 250px; margin: 15px 0; border-radius: 10px; border: 1px solid #eee;">
        <div id="socialLink"></div>
    </div>
</div>

<script>
    const data = {
        "نساء وتوليد": [
            {
                name: "د. محمود حمدي عبد البصير",
                phone: "01211708682",
                address: "باها - منزل أ. رجب مطراوي - بجوار مسجد الشيخ زين الدين",
                time: "سبت، اثنين، أربعاء (8 م - 11 م)",
                workDays: [1, 3, 6], startH: 20, endH: 23,
                map: "https://plus.codes/42R6+8F8+Beni+Suef",
                qualifications: [
                    "استشاري الحقن المجهري وجراحة المناظير",
                    "دكتوراه ومدرس أمراض النساء والتوليد بكلية الطب",
                    "دبلومة الحقن المجهري جامعة الأزهر",
                    "عضو الجمعية المصرية للتدخل الجراحي بالمناظير"
                ],
                qr: "mahmoud-clinic-qr.png",
                socialUrl: "https://www.facebook.com/MotherHealthClinic"
            }
        ],
        "عظام": [
            {
                name: "د. عبدالرحمن مصطفى عبدالفتاح",
                phone: "01284798494",
                address: "باها - شارع السوق بجوار استوديو النجوم",
                time: "يومياً (7 م - 11 م) عدا الاثنين",
                workDays: [0, 2, 3, 4, 5, 6], startH: 19, endH: 23,
                map: "https://plus.codes/42Q6+JVQ+Beni+Suef",
                qualifications: ["أخصائي جراحة العظام والمفاصل والعمود الفقري"],
                qr: "abdelrahman-clinic-qr.png",
                socialUrl: "https://www.facebook.com/drabdelrahman.mostafa.5" 
            }
        ],
        "باطنة": [], "أطفال": [], "جراحة": [], "جلدية": [], "رمد": [], "أنف وأذن": []
    };

    function checkStatus(doc) {
        const now = new Date();
        const day = now.getDay();
        const hour = now.getHours();
        if (doc.workDays.includes(day)) {
            if (hour >= doc.startH && hour < doc.endH) return {text: '🟢 مفتوح الآن', bg: '#e8f5e9', color: '#2e7d32'};
            return {text: '🔴 مغلق حالياً', bg: '#ffebee', color: '#c62828'};
        }
        return {text: '⚪ مغلق اليوم', bg: '#f5f5f5', color: '#757575'};
    }

    function showSection(id) {
        ['section-home', 'section-specialties', 'section-doctors-list', 'section-doctor-detail'].forEach(s => {
            document.getElementById(s).classList.toggle('hidden', s !== id);
        });
        window.scrollTo(0,0);
    }

    function renderDoctorList(spec) {
        const container = document.getElementById('list-container');
        container.innerHTML = `<h2 style="text-align:center; color:var(--primary);">دكاترة ${spec}</h2>`;
        const docs = data[spec] || [];
        if(docs.length === 0) {
            container.innerHTML += `<p style="text-align:center; padding:50px; color:#999;">سيتم إضافة دكاترة ${spec} قريباً إن شاء الله</p>`;
        } else {
            docs.forEach((doc, i) => {
                container.innerHTML += `<div class="folder-item" onclick="renderDoctorDetail('${spec}', ${i})"><span>👨‍⚕️ ${doc.name}</span><span>التفاصيل ⬅</span></div>`;
            });
        }
        showSection('section-doctors-list');
    }

    function renderDoctorDetail(spec, i) {
        const doc = data[spec][i];
        const status = checkStatus(doc);
        document.getElementById('back-to-list-btn').onclick = () => renderDoctorList(spec);
        document.getElementById('detail-container').innerHTML = `
            <div class="doctor-detail-card">
                <div class="status-badge" style="background:${status.bg}; color:${status.color}">${status.text}</div>
                <h2>${doc.name}</h2>
                <div class="info-row">📍 <b>العنوان:</b><br>${doc.address}</div>
                <div class="info-row">⏰ <b>المواعيد:</b><br>${doc.time}</div>
                <button class="btn" style="background:#f0f7ff; color:var(--primary); width:100%; margin:15px 0; border:1px solid #d0e4ff;" onclick="showQuals('${spec}', ${i})">🎓 عرض الشهادات والخبرات</button>
                <div class="actions">
                    <a href="tel:${doc.phone}" class="btn btn-call">📞 اتصال</a>
                    <a href="${doc.map}" target="_blank" class="btn btn-map">🗺️ الخريطة</a>
                    <button class="btn btn-social" onclick="showSocial('${doc.qr}', '${doc.socialUrl}')">🌐 الباركود والسوشيال</button>
                </div>
            </div>`;
        showSection('section-doctor-detail');
    }

    function showQuals(spec, i) {
        const doc = data[spec][i];
        document.getElementById('modalBody').innerHTML = doc.qualifications.map(q => `<li style="margin-bottom:8px; text-align:right;">${q}</li>`).join('');
        document.getElementById('infoModal').style.display = 'flex';
    }

    function showSocial(qr, link) {
        if(!qr && !link) return alert("سيتم إضافة الروابط قريباً");
        const qrImg = document.getElementById('qrImg');
        if(qr) {
            qrImg.src = qr;
            qrImg.style.display = "inline-block";
        } else {
            qrImg.style.display = "none";
        }
        document.getElementById('socialLink').innerHTML = link ? `<a href="${link}" target="_blank" class="link-btn">زيارة صفحة الدكتور</a>` : "";
        document.getElementById('socialModal').style.display = 'flex';
    }

    function hideModal() { 
        document.getElementById('infoModal').style.display = 'none';
        document.getElementById('socialModal').style.display = 'none';
    }

    window.onclick = function(event) {
        if (event.target.className === 'modal') hideModal();
    }

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js'); });
    }
</script>
</body>
    </html>
